# Key order follows the pnpm-workspace convention enforced by yaml/sort-keys.

# `pnpm add <dep>` writes the catalog entry and the package's "catalog:" reference
# in one step, and refuses a version outside a range the catalog already holds, so
# adding a dependency never leaves the catalog rule or the lockfile to fix afterwards.
catalogMode: strict

# Supply-chain hardening: 48h cooldown against compromised fresh releases.
minimumReleaseAge: 2880
# Install, add, update, remove, and dedupe drop a minimumReleaseAgeExclude entry
# the new lockfile no longer resolves. @antfu/eslint-config requires the setting,
# but pnpm reads it only from 11.22, so the pinned 11.9 ignores it for now.
minimumReleaseAgeExcludePrune: true

# No silently-downgraded publish trust.
trustPolicy: no-downgrade
# vite 5.4.21 (pinned by vitepress 1.x) switched publish evidence from trusted
# publisher to provenance attestation: a known false positive for no-downgrade,
# not a takeover. The entry names that version alone: a bare `vite` would also
# waive the check for the vite 7 that vitest runs, and ESLint rejects one. pnpm
# takes exact versions but no range, so when vitepress resolves a newer 5.x and
# the install fails, append it (vite@5.4.21 || 5.4.22). Remove when vitepress
# moves off vite 5.
trustPolicyExclude:
  - vite@5.4.21

# Run package.json scripts through pnpm's shell emulator, so `CI=1 eslint .`-style env
# prefixes and `&&` chains behave the same on Windows as on POSIX.
shellEmulator: true

# Fail installs on incompatible node (replaces the old .npmrc engine-strict).
engineStrict: true

# Workspace globs. The samples populate both; pnpm tolerates an empty glob once
# a sample is removed.
packages:
  - apps/*
  - packages/*

# Build scripts are blocked by default; explicit verdicts only. esbuild needs its
# native binary (vite 5 via vitepress and vite 7 via vitest both depend on it).
# @parcel/watcher: automd imports it only in --watch mode, its prebuilt binary arrives
# as an optional dependency, and its install script is a no-op unless building from
# source — so no build script is needed.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true

# Catalog-first (enforced by pnpm/json-enforce-catalog): every dependency
# version lives here once; packages reference "catalog:".
catalog:
  '@antfu/eslint-config': ^9.0.0
  '@commitlint/cli': ^20.0.0
  '@commitlint/config-conventional': ^20.0.0
  '@secretlint/secretlint-rule-preset-recommend': ^13.0.0
  '@tsconfig/node24': ^24.0.0
  '@tsconfig/strictest': ^2.0.0
  '@types/node': ^24.0.0
  automd: ^0.4.0
  changelogen: ^0.6.0
  eslint: ^10.0.0
  jiti: ^2.0.0
  lint-staged: ^16.0.0
  mermaid: ^11.0.0
  secretlint: ^13.0.0
  turbo: ^2.0.0
  typescript: ^5.9.0
  # vitest 4 peers on vite >=6; without an explicit vite entry pnpm would
  # resolve the peer to vitepress's vite 5 and vitest fails at startup. Same
  # skew is why @vitest/coverage-v8 is intentionally absent: it loads its own
  # vitest whose transitive vite peer still dedupes to vitepress's vite 5 (no
  # ./module-runner export), crashing `vitest --coverage`. Re-add coverage-v8
  # + the coverage block in vitest.config.ts once vitepress moves off vite 5.
  vite: ^7.0.0
  vitepress: ^1.6.0
  vitepress-plugin-llms: ^1.0.0
  vitepress-plugin-mermaid: ^2.0.0
  vitest: ^4.0.0
