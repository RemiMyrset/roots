# Path rules for .github/workflows/labeler.yml: a pull request that touches a path gets the
# label, and loses it again when the touch is gone (sync-labels). The labels themselves are
# defined in labels.yml.
spec:
  - changed-files:
      - any-glob-to-any-file: docs/internal/specs/**
decision:
  - changed-files:
      - any-glob-to-any-file: docs/internal/decisions/**
docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '*.md'
