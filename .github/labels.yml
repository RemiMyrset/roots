# Label definitions synced to the repo by .github/workflows/labels.yml.
# GitHub templates do NOT copy labels to child repos — this file + workflow do.
# Who applies them: spec, decision, and docs come from .github/workflows/labeler.yml by
# changed path; agent-task and bug from the issue templates; dependencies and security from
# Renovate; enhancement by hand.
- name: agent-task
  color: 7057ff
  description: Well-scoped task an AI agent executes end to end
- name: spec
  color: 0e8a16
  description: Touches docs/internal/specs
- name: decision
  color: d93f0b
  description: Touches docs/internal/decisions
- name: docs
  color: 0075ca
  description: Documentation only
- name: bug
  color: d73a4a
  description: Something is broken
- name: enhancement
  color: a2eeef
  description: New capability or improvement
- name: dependencies
  color: 0366d6
  description: Dependency or action-pin update opened by Renovate
- name: security
  color: b60205
  description: Vulnerability fix opened by Renovate
