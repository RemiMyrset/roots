# Publishes docs/public to GitHub Pages — the standard way to host the public site.
# Builds on every push to main that touches the site (the build is a useful check on
# its own) and deploys only when Pages is enabled for the repository: Settings →
# Pages → Source: GitHub Actions, or
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
# A repository that never enables Pages sees a green run whose notice says "the
# site was built but not deployed". Recipe: docs/template/docs-toolchain.md,
# "Publish the public site".
# Action pinning: every action by full commit SHA with its version in a trailing comment;
# Renovate (renovate.json) moves the SHA and the comment together.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/public/**
      - docs/.shared/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

# One deploy at a time, never cancelled mid-flight: a cancelled Pages deploy can
# leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege per job: the build only reads the Pages settings; only the deploy writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages-enabled.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Is GitHub Pages enabled for this repository?
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the Pages URL
        if: steps.pages-enabled.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the public site
        env:
          # Set by configure-pages when Pages is enabled; empty otherwise, so a local
          # or unpublished build keeps relative links and the default base. The site
          # config normalizes the slashes of base_path (`/REPO`, or empty).
          DOCS_URL: ${{ steps.pages.outputs.base_url }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm docs:public:build

      # Required SHA pinning also covers the actions a composite action calls: v3 called
      # upload-artifact by tag and failed at job setup. Check a bump's own action.yml.
      - name: Upload the site
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public/.vitepress/dist

      - name: Not deployed (Pages is not enabled)
        if: steps.pages-enabled.outputs.enabled != 'true'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository; the site was built but not deployed. Enable it under Settings → Pages → Source: GitHub Actions, or run the gh command in docs/template/docs-toolchain.md (Publish the public site)."

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Published to $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
