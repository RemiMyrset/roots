# Publishes docs/public to GitHub Pages — the standard way to host the public site.
# Builds on every pull request and every push to main that touches the site, so a broken
# build or action pin shows before merge. Deploys only from main, and only when Pages is
# enabled for the repository: Settings → Pages → Source: GitHub Actions, or
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
# A repository that never enables Pages sees a green run whose notice says "the
# site was built but not deployed". Recipe: docs/template/docs-toolchain.md,
# "Publish the public site".
# Action pinning: every action by full commit SHA with its version in a trailing comment;
# the update-deps skill moves the SHA and the comment together.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/public/**
      - docs/.shared/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/public/**
      - docs/.shared/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

# One deploy at a time, never cancelled mid-flight: a cancelled Pages deploy can
# leave the site half-published. Any other ref only builds, so a newer run replaces it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege per job: the build only reads the Pages settings; only the deploy writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages-enabled.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: lastUpdated dates each page and the sitemap from git log
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only a 404 means "not enabled"; any other API failure fails the run, so an outage
      # never skips a deploy behind a green run and a misleading notice.
      - name: Is GitHub Pages enabled for this repository?
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if err=$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 > /dev/null); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            case "$err" in
              *"(HTTP 404)"*) echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Could not tell whether GitHub Pages is enabled: $err"; exit 1 ;;
            esac
          fi

      - name: Resolve the Pages URL
        if: steps.pages-enabled.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the public site
        env:
          # Set by configure-pages when Pages is enabled; empty otherwise, so a local
          # or unpublished build keeps relative links and the default base. The site
          # config normalizes the slashes of base_path (`/REPO`, or empty).
          DOCS_URL: ${{ steps.pages.outputs.base_url }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm docs:public:build

      # Required SHA pinning also covers the actions a composite action calls: v3 called
      # upload-artifact by tag and failed at job setup. Check a bump's own action.yml.
      - name: Upload the site
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public/.vitepress/dist

      - name: Not deployed (Pages is not enabled)
        if: steps.pages-enabled.outputs.enabled != 'true'
        run: |
          echo "::notice::GitHub Pages is not enabled for this repository; the site was built but not deployed. Enable it under Settings → Pages → Source: GitHub Actions, or run the gh command in docs/template/docs-toolchain.md (Publish the public site)."

  deploy:
    needs: build
    # A pull request, or a dispatch from another branch, stops at the build.
    if: needs.build.outputs.enabled == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Published to $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
