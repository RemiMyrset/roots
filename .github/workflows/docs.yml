# Docs integrity — blocking: automd drift, structure lint, portability
# lint, both VitePress builds. Advisory (never blocks): spec-discipline nudge.
# Action pinning: every action by full commit SHA with its version in a trailing comment;
# Renovate (renovate.json) moves the SHA and the comment together.
name: docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the spec-discipline diff below
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generated sections are current (blocking)
        run: |
          pnpm docs:gen
          # git status --porcelain also catches UNTRACKED regenerated files
          # (e.g. a regenerated file that was deleted) that git diff would miss.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated docs are stale. Run 'pnpm docs:gen' and commit the result."
            exit 1
          fi

      - name: Structure lint (blocking)
        run: pnpm docs:check

      - name: Portability lint (blocking)
        run: pnpm docs:portability

      - name: Internal site builds (blocking)
        run: pnpm docs:internal:build

      - name: Public site builds (blocking)
        run: pnpm docs:public:build

      - name: Spec-discipline nudge (advisory, never blocks)
        # Structurally advisory: even if origin/$BASE_REF fails to resolve (e.g.
        # a future edit drops fetch-depth:0), this step can never fail the job.
        continue-on-error: true
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          nondocs=$(echo "$changed" | grep -v -E '^(docs/|\.github/|\.claude/)' | grep -v -E '^[^/]+\.md$' || true)
          docsync=$(echo "$changed" | grep -E '^docs/internal/(specs|decisions)/' || true)
          if [ -n "$nondocs" ] && [ -z "$docsync" ]; then
            echo "::warning::Files outside docs/ changed with no matching specs or decisions edit. If behavior changed, source + tests + spec move in the same PR."
          fi
