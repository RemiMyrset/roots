# Exercises scripts/init.mts non-interactively so the one-shot initializer —
# the most fragile shipped artifact, run exactly once per child — can never
# regress silently. Copies the worktree, runs init with defaults, then re-runs
# every gate on the result.
name: init-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: init-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init-check:
    # init.mts deletes itself and this workflow at init time, so a child never
    # runs it; it only makes sense in the template — and in any fork marked as a
    # template that develops it further.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Run init with defaults in a copy
        run: |
          rsync -a --exclude node_modules --exclude .git . /tmp/init-child/
          cd /tmp/init-child
          node scripts/init.mts --defaults
          test ! -f scripts/init.mts # must self-delete
          test ! -f .github/workflows/init-check.yml # this workflow is template-only

      - name: Init rewrote branding and stripped template-only banners
        run: |
          cd /tmp/init-child
          # package renamed to the derived slug (dir name), not left as "roots"
          node -e "process.exit(require('./package.json').name === 'init-child' ? 0 : 1)"
          grep -q '# init-child agent rulebook' AGENTS.md   # H1 rebranded
          # Negative assertions use `if grep; then exit 1` — a bare `! grep` is a no-op
          # mid-block under `set -e` (POSIX: exit status of a `!`-inverted command is ignored).
          if grep -q '# roots agent rulebook' AGENTS.md; then echo "::error::old H1 leaked"; exit 1; fi
          if grep -q '@roots/core' package.json AGENTS.md packages/core/package.json packages/core/src/index.ts; then echo "::error::@roots/core leaked"; exit 1; fi
          if grep -rq 'roots:template-only' AGENTS.md README.md; then echo "::error::template-only banner leaked"; exit 1; fi
          # README + docs-site titles/H1s rebranded to the derived slug. These are
          # exact-string .replace() calls that silently no-op if ever reworded —
          # assert the new value is present so a stale "roots" cannot ship green.
          grep -q '^# init-child$' README.md
          grep -q "title: 'init-child'" docs/.shared/config.ts
          grep -q "title: 'init-child — internal handbook'" docs/internal/.vitepress/config.ts
          grep -q "title: 'init-child'" docs/public/.vitepress/config.ts
          grep -q '^# init-child internal handbook$' docs/internal/index.md
          grep -q '^# init-child$' docs/public/index.md
          grep -q '^# init-child documentation$' docs/README.md
          if grep -rq 'Rapid Opinionated Onboarding' README.md AGENTS.md package.json; then echo "::error::template pitch leaked"; exit 1; fi
          # Decision log reset to the child's own 0001: new provenance body written,
          # template's meta-decision body removed (not appended to).
          grep -q 'created from the roots template' docs/internal/decisions/0001-adopt-roots-conventions.md
          if grep -q '19-repo fleet survey' docs/internal/decisions/0001-adopt-roots-conventions.md; then echo "::error::old 0001 body leaked"; exit 1; fi

      - name: Initialized child passes every gate
        run: |
          cd /tmp/init-child
          pnpm install --no-frozen-lockfile
          pnpm docs:gen
          pnpm docs:check
          pnpm docs:portability
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm docs:internal:build
          pnpm docs:public:build

      - name: Run init on the TypeScript-removal path
        run: |
          rsync -a --exclude node_modules --exclude .git . /tmp/init-child-nots/
          cd /tmp/init-child-nots
          node scripts/init.mts --defaults --no-typescript
          test ! -f scripts/init.mts
          test ! -f turbo.json
          test ! -d packages
          test ! -f tsconfig.json       # root config extended the deleted base
          test ! -f tsconfig.base.json
          test ! -f eslint.config.ts    # flat ESLint config removed with the TS layer
          test ! -f .github/workflows/init-check.yml
          # the rulebook must not command deleted scripts (if grep; a bare `! grep` is a
          # no-op mid-block under `set -e`)
          if grep -q 'ALWAYS use TypeScript' AGENTS.md; then echo "::error::TS rule leaked"; exit 1; fi
          if grep -q 'pnpm build' AGENTS.md; then echo "::error::pnpm build leaked in AGENTS.md"; exit 1; fi
          # README command rows for the deleted scripts are stripped
          if grep -q 'pnpm build' README.md; then echo "::error::pnpm build row leaked in README"; exit 1; fi
          if grep -q 'pnpm lint' README.md; then echo "::error::pnpm lint row leaked in README"; exit 1; fi
          # AGENTS.md Monorepo map rewritten to the no-TS placeholder (old map named packages/core)
          grep -q 'workspace layer was removed at init' AGENTS.md
          if grep -q 'packages/core' AGENTS.md; then echo "::error::packages/core leaked in AGENTS.md"; exit 1; fi
          # ci.yml replaced with the manual-only placeholder, hardened with persist-credentials
          grep -q 'workflow_dispatch' .github/workflows/ci.yml
          grep -q 'persist-credentials: false' .github/workflows/ci.yml
          # package.json surgery: TS scripts + lint-staged removed, pre-commit rewritten, TS devDeps gone
          node -e "const p=require('./package.json'); const s=p.scripts||{}; const d=p.devDependencies||{}; process.exit((!s.build && !s.test && !s.typecheck && !s.lint && !s['lint:fix'] && !p['lint-staged'] && !d.typescript && !d.eslint && !d.turbo && !d['@antfu/eslint-config'] && p['simple-git-hooks']['pre-commit']==='pnpm docs:portability')?0:1)"
          # editor config scrubbed: dangling tsdk pin removed, ESLint rec dropped, JSON still valid
          test ! -f .vscode/settings.json
          if grep -q 'dbaeumer' .vscode/extensions.json; then echo "::error::ESLint rec leaked into no-TS child"; exit 1; fi
          node -e "JSON.parse(require('fs').readFileSync('.vscode/extensions.json','utf8'))"

      - name: Non-TypeScript child passes the docs gates
        run: |
          cd /tmp/init-child-nots
          pnpm install --no-frozen-lockfile
          pnpm docs:gen
          pnpm docs:check
          pnpm docs:portability
          pnpm docs:internal:build
          pnpm docs:public:build

      - name: deriveSlug uses the git remote (the path every real child takes)
        # --defaults with no remote falls back to the dir name (covered above); a real
        # child has an origin remote, so exercise REMOTE_SLUG_RE too.
        run: |
          rsync -a --exclude node_modules --exclude .git . /tmp/init-remote/
          cd /tmp/init-remote
          git init -q
          git remote add origin https://github.com/acme/derived-from-remote.git
          node scripts/init.mts --defaults
          node -e "process.exit(require('./package.json').name === 'derived-from-remote' ? 0 : 1)"
          grep -q '# derived-from-remote agent rulebook' AGENTS.md
