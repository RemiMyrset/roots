# Project CI on Ubuntu and Windows: frozen-lockfile install, typecheck, lint, secrets, test,
# test:hooks, test:sync, test:docs, test:gates, build (turbo orchestrates build/test/typecheck).
# Every step runs under bash on both runners. scripts/test-gates.mts keeps these steps and
# pnpm verify equal. The one non-gate step runs `pnpm verify --only` for a fast gate, so the
# verify script's own pnpm spawn is exercised on both platforms (it once broke on Windows).
# Action pinning: every action by full commit SHA with its version in a trailing comment;
# Renovate (renovate.json) moves the SHA and the comment together.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its older run. Every other run gets a group of its
# own commit: GitHub keeps one run pending per group and cancels the pending one before it, so
# a shared group would leave a commit merged right behind another with no verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Turbo's local cache, keyed on the commit and restored from the newest run on this OS,
      # so the test and typecheck tasks replay unchanged packages instead of rerunning them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify --only lint:secrets # not a gate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:secrets
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm test:sync
      - run: pnpm test:docs
      - run: pnpm test:gates
      - run: pnpm build
