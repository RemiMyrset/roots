# Project CI on Ubuntu and Windows: frozen-lockfile install, typecheck, lint, secrets, test,
# test:hooks, test:sync, test:docs, test:gates, build (turbo orchestrates build/test/typecheck).
# Every step runs under bash on both runners. scripts/test-gates.mts keeps these steps and
# pnpm verify equal. The one non-gate step runs `pnpm verify --only` for a fast gate, so the
# verify script's own pnpm spawn is exercised on both platforms (it once broke on Windows).
# Action pinning: every action by full commit SHA with its version in a trailing comment;
# Renovate (renovate.json) moves the SHA and the comment together.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify --only lint:secrets # not a gate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:secrets
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm test:sync
      - run: pnpm test:docs
      - run: pnpm test:gates
      - run: pnpm build
